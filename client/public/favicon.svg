<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Solid Black Background -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  
  <!-- Sleek brand-aligned border gradient (Blue to Violet) for premium touch -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#accentGradient)" stroke-width="16" />
  
  <!-- Bold modern sans-serif CSE text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="190" font-weight="900" fill="url(#textGradient)" letter-spacing="-5">CSE</text>

  <defs>
    <!-- Border Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
</svg>